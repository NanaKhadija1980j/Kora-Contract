[package]
name = "kora-tranche"
version = "0.1.0"
edition = "2021"

# `cdylib` is required so the tranche contract can be built to WASM and
# deployed alongside the other contracts (issue #990).
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
kora-shared = { path = "../shared" }
kora-invoice-nft = { path = "../invoice_nft" }
soroban-sdk = { workspace = true }

[dev-dependencies]
kora-shared = { path = "../shared" }
soroban-sdk = { workspace = true, features = ["testutils"] }
